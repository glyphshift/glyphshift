[package]
name = "glyphshift-desktop-shell"
version = "0.2.0"
edition.workspace = true
license.workspace = true
description = "Glyphshift desktop shell"

[lib]
name = "glyphshift_desktop_shell"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
glyphshift-desktop-backend = { path = "../../../crates/glyphshift-desktop-backend" }
glyphshift-desktop-runtime = { path = "../../../crates/glyphshift-desktop-runtime" }
glyphshift-domain = { path = "../../../crates/glyphshift-domain" }
glyphshift-workflow = { path = "../../../crates/glyphshift-workflow" }
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.11.3", features = [] }
tauri-plugin-dialog = "2.6.0"

[target.'cfg(windows)'.dependencies]
winreg = "0.55.0"

[dev-dependencies]
glyphshift-adapter-registry = { path = "../../../crates/glyphshift-adapter-registry" }
serde_json = "1.0"
tempfile = "3.23.0"

[lints]
workspace = true
