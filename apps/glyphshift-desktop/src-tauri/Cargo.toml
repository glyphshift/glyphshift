[package]
name = "glyphshift-desktop-shell"
version = "0.2.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Glyphshift desktop shell"

[lib]
name = "glyphshift_desktop_shell"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
glyphshift-capture = { path = "../../../crates/core/capture" }
glyphshift-controller-windows = { path = "../../../crates/runtime/controller/windows" }
glyphshift-desktop-backend = { path = "../../../crates/product/desktop-backend" }
glyphshift-desktop-runtime = { path = "../../../crates/runtime/desktop" }
glyphshift-dictionary-distribution = { path = "../../../crates/dictionary/distribution" }
glyphshift-domain = { path = "../../../crates/core/domain" }
glyphshift-interactive-translation = { path = "../../../crates/product/interactive-translation" }
glyphshift-runtime-contract = { path = "../../../crates/runtime/contract" }
glyphshift-translation = { path = "../../../crates/core/translation" }
glyphshift-workflow = { path = "../../../crates/core/workflow" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-dialog = "2.6.0"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-opener = "2"
tempfile = "3.23.0"

[target.'cfg(windows)'.dependencies]
winreg = "0.55.0"

[dev-dependencies]
glyphshift-acquisition = { path = "../../../crates/runtime/acquisition" }
glyphshift-adapter-registry = { path = "../../../crates/adapters/platform/registry" }
glyphshift-dictionary-package = { path = "../../../crates/dictionary/package" }
sha2 = "0.10"

[lints]
workspace = true
