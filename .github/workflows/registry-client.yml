name: Registry client contracts

on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'apps/glyphshift-desktop/**'
      - 'crates/product/registry-client/**'
      - 'crates/dictionary/**'
      - 'crates/adapters/platform/package/**'
      - 'scripts/*registry-client*'
      - '.github/workflows/registry-client.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Read pinned Registry fixture revision
        id: registry
        shell: pwsh
        run: |
          $lock = Get-Content -Raw crates/product/registry-client/registry.lock.json | ConvertFrom-Json
          if ($lock.commit -notmatch '^[0-9a-f]{40}$') { throw 'Invalid Registry fixture revision.' }
          "commit=$($lock.commit)" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@v6
        with:
          repository: glyphshift/registry
          ref: ${{ steps.registry.outputs.commit }}
          path: local-test/providers/registry
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: local-test/providers/registry/go.mod
          cache-dependency-path: local-test/providers/registry/go.sum
      - name: Build pinned Go Registry fixture
        shell: pwsh
        working-directory: local-test/providers/registry
        run: |
          go build -trimpath -o registry-local.exe ./cmd/registry-local
          if ($LASTEXITCODE -ne 0) { throw 'Registry fixture build failed.' }
      - name: Install repository Rust components
        shell: pwsh
        run: |
          rustup show active-toolchain
          if ($LASTEXITCODE -ne 0) { throw 'Repository Rust installation failed.' }
          rustup component add clippy rustfmt
          if ($LASTEXITCODE -ne 0) { throw 'Repository Rust components failed.' }
      - name: Validate Rust contracts and Go HTTPS installation
        shell: pwsh
        run: ./scripts/test-registry-client.ps1 -RegistryExecutable (Resolve-Path local-test/providers/registry/registry-local.exe).Path

      - name: Validate desktop Registry commands
        shell: pwsh
        run: |
          . ./scripts/cargo-target.ps1
          $null = Get-GlyphshiftCargoTargetDirectory -RepoRoot (Get-Location).Path
          cargo test --locked -p glyphshift-desktop-shell --lib
          if ($LASTEXITCODE -ne 0) { throw 'Desktop Registry command tests failed.' }
      - name: Validate dictionary interface
        shell: pwsh
        working-directory: apps/glyphshift-desktop
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'Desktop dependencies failed.' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'Desktop web build failed.' }
          npx playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw 'Playwright browser installation failed.' }
          npm test -- tests/dictionary.spec.ts
          if ($LASTEXITCODE -ne 0) { throw 'Dictionary interface tests failed.' }
