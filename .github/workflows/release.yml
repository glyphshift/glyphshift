name: Release Windows app

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Windows release
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/glyphshift-desktop/package-lock.json

      - name: Use stable Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add i686-pc-windows-msvc

      - name: Cache Rust release build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            local-test/desktop-release/tauri-build
          key: ${{ runner.os }}-glyphshift-release-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-glyphshift-release-

      - name: Verify tag matches application version
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = '${{ github.ref_name }}'
          if ($tag -notmatch '^v(?<version>\d+\.\d+\.\d+)$') {
            throw "Release tags must use vMAJOR.MINOR.PATCH, received '$tag'."
          }
          $version = $Matches.version
          $packageVersion = (Get-Content -Raw -LiteralPath 'apps/glyphshift-desktop/package.json' | ConvertFrom-Json).version
          $tauriVersion = (Get-Content -Raw -LiteralPath 'apps/glyphshift-desktop/src-tauri/tauri.conf.json' | ConvertFrom-Json).version
          $cargoVersionMatch = Select-String -LiteralPath 'apps/glyphshift-desktop/src-tauri/Cargo.toml' -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1
          if ($null -eq $cargoVersionMatch) {
            throw 'Could not read the desktop Cargo package version.'
          }
          $cargoVersion = $cargoVersionMatch.Matches[0].Groups[1].Value
          $versions = [ordered]@{
            tag = $version
            package = $packageVersion
            tauri = $tauriVersion
            cargo = $cargoVersion
          }
          if (@($versions.Values | Select-Object -Unique).Count -ne 1) {
            throw "Release version mismatch: $($versions | ConvertTo-Json -Compress)"
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Set up Python for documentation and distribution checks
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify Public Core source boundary
        shell: pwsh
        run: python -B scripts/check-public-core-boundary.py

      - name: Verify base Runtime distribution contracts
        shell: pwsh
        run: |
          python -B scripts/test-base-runtime.py
          if ($LASTEXITCODE -ne 0) { throw 'Base Runtime distribution contracts failed.' }

      - name: Read pinned documentation revision
        id: docs
        shell: pwsh
        run: |
          $source = Get-Content -Raw docs-source.lock.json | ConvertFrom-Json
          if ($source.schema -ne 'glyphshift.docs-source/1' -or $source.repository -ne 'glyphshift/docs' -or $source.contentDirectory -ne 'content' -or $source.commit -notmatch '^[0-9a-f]{40}$') {
            throw 'Invalid documentation source lock.'
          }
          "commit=$($source.commit)" >> $env:GITHUB_OUTPUT

      - name: Check out pinned user documentation
        uses: actions/checkout@v6
        with:
          repository: glyphshift/docs
          ref: ${{ steps.docs.outputs.commit }}
          path: local-test/docs-source
          persist-credentials: false

      - name: Package documentation
        shell: pwsh
        run: python scripts/yueli_docs_publish.py pack local-test/docs-source/content --output local-test/evidence/docs-release/docs.zip

      - name: Install desktop dependencies
        working-directory: apps/glyphshift-desktop
        shell: pwsh
        run: npm ci

      - name: Build verified NSIS release
        shell: pwsh
        run: ./scripts/build-desktop-release.ps1

      - name: Collect release assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $buildRoot = Get-ChildItem -LiteralPath 'local-test/evidence/desktop-release' -Directory |
            Sort-Object Name -Descending |
            Select-Object -First 1
          if ($null -eq $buildRoot) {
            throw 'The desktop release build did not create a candidate directory.'
          }
          $candidateRoot = Join-Path $buildRoot.FullName 'candidate'
          $installers = @(Get-ChildItem -LiteralPath $candidateRoot -Filter '*.exe' -File |
            Where-Object { $_.Name -ne 'glyphshift-desktop-shell.exe' })
          if ($installers.Count -ne 1) {
            throw "Expected one NSIS installer, found $($installers.Count)."
          }
          $installer = $installers[0]
          $manifest = Join-Path $candidateRoot 'candidate-manifest.json'
          if ($null -eq $installer -or -not (Test-Path -LiteralPath $manifest -PathType Leaf)) {
            throw 'The verified installer or candidate manifest is missing.'
          }

          $assetRoot = New-Item -ItemType Directory -Path 'release-assets' -Force
          Copy-Item -LiteralPath $installer.FullName -Destination $assetRoot.FullName
          Copy-Item -LiteralPath $manifest -Destination $assetRoot.FullName
          Copy-Item -LiteralPath 'local-test/evidence/docs-release/docs.zip' -Destination $assetRoot.FullName
          . ./scripts/cargo-target.ps1
          $targetRoot = Get-GlyphshiftCargoTargetDirectory -RepoRoot (Get-Location).Path
          Copy-Item -LiteralPath (Join-Path $targetRoot 'release/glyphshift-plugin.exe') -Destination $assetRoot.FullName
          Get-ChildItem -LiteralPath $assetRoot.FullName -File | Where-Object Name -ne 'SHA256SUMS.txt' | Sort-Object Name | ForEach-Object {
            "$((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)"
          } | Out-File -LiteralPath (Join-Path $assetRoot.FullName 'SHA256SUMS.txt') -Encoding ascii

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $tag = '${{ github.ref_name }}'
          gh release view $tag --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            throw "Release '$tag' already exists; published release assets are not overwritten."
          }
          $assets = @(Get-ChildItem -LiteralPath 'release-assets' -File | ForEach-Object { $_.FullName })
          $expected = 5
          if ($assets.Count -ne $expected) {
            throw "Expected $expected release assets, found $($assets.Count)."
          }
          $notes = 'The Windows installer is currently unsigned. Windows SmartScreen may ask for confirmation before installation.'
          gh release create $tag @assets `
            --verify-tag `
            --generate-notes `
            --latest `
            --title "Glyphshift $env:RELEASE_VERSION" `
            --notes $notes
          if ($LASTEXITCODE -ne 0) {
            throw 'GitHub Release publication failed.'
          }
