[package]
name = "glyphshift-windows-host"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
glyphshift-adapter-gdi = { path = "../../crates/adapters/implementations/gdi" }
glyphshift-adapter-gdiplus = { path = "../../crates/adapters/implementations/gdiplus" }
glyphshift-adapter-sdk = { path = "../../crates/adapters/platform/sdk" }
glyphshift-domain = { path = "../../crates/core/domain" }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_GdiPlus",
    "Win32_System_Console",
    "Win32_UI_WindowsAndMessaging",
] }

[dependencies.windows]
version = "0.58"
features = [
    "Foundation_Numerics",
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_System_Com",
]

[lints.rust]
unsafe_code = "allow"
