[package]
name = "glyphshift-adapter-ocr-worker"
autobins = false
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "glyphshift-adapter-ocr-acquisition-worker"
path = "src/main.rs"

[dependencies]
glyphshift-acquisition = { path = "../../../runtime/acquisition" }
glyphshift-acquisition-worker-sdk = { path = "../../../runtime/worker/acquisition-sdk" }
glyphshift-adapter-ocr = { path = "../ocr" }
glyphshift-worker-process-grant = { path = "../../../runtime/worker/process-grant" }
windows-capture = "=2.0.0"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
glyphshift-acquisition-worker-host = { path = "../../../runtime/worker/acquisition-host" }
glyphshift-adapter-uia = { path = "../uia" }
glyphshift-adapter-uia-worker = { path = "../uia-worker" }

[lints.rust]
unsafe_code = "allow"
