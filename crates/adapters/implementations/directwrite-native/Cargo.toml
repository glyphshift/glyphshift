[package]
name = "glyphshift-adapter-directwrite-native"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
glyphshift-adapter-directwrite = { path = "../directwrite" }
glyphshift-adapter-native-abi = { path = "../../platform/native-abi" }
retour = "0.3"

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
]

[lints.rust]
unsafe_code = "allow"
