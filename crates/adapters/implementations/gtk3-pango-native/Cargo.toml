[package]
name = "glyphshift-adapter-gtk3-pango-native"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
glyphshift-adapter-gtk3-pango = { path = "../gtk3-pango" }
glyphshift-adapter-native-abi = { path = "../../platform/native-abi" }
retour = "0.3"

[dependencies.windows]
version = "0.58"
features = [
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
]

[lints.rust]
unsafe_code = "allow"
