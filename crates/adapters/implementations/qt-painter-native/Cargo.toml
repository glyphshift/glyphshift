[package]
name = "glyphshift-adapter-qt-painter-native"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
glyphshift-adapter-native-abi = { path = "../../platform/native-abi" }
glyphshift-adapter-qt-painter = { path = "../qt-painter" }
retour = "0.3"

[dependencies.windows]
version = "0.58"
features = ["Win32_System_LibraryLoader"]

[lints.rust]
unsafe_code = "allow"
