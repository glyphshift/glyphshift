[package]
name = "glyphshift-adapter-native-host"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
glyphshift-adapter-native-abi = { path = "../native-abi" }
glyphshift-adapter-sdk = { path = "../sdk" }
glyphshift-domain = { path = "../../../core/domain" }
libloading = "0.8"
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
glyphshift-adapter-directwrite = { git = "https://github.com/glyphshift/adapter-directwrite.git", rev = "c5b6335384cb9b0da5186275dcfc60f99317c898" }
glyphshift-adapter-gdi = { git = "https://github.com/glyphshift/adapter-win32-text.git", rev = "506b61c080f854e9edbe46b3e0991107a3e98d3b" }
glyphshift-adapter-gdiplus = { git = "https://github.com/glyphshift/adapter-gdiplus.git", rev = "ca85012ef41a6e4d7c79a0c065167a5c9a16290e" }
glyphshift-windows-host = { path = "../../../../test-support/windows-host" }

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.58", features = ["Win32_System_LibraryLoader"] }

[lints.rust]
unsafe_code = "allow"
