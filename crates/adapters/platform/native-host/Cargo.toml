[package]
name = "glyphshift-adapter-native-host"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
glyphshift-adapter-native-abi = { path = "../native-abi" }
glyphshift-adapter-sdk = { path = "../sdk" }
glyphshift-domain = { path = "../../../core/domain" }
libloading = "0.8"
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
glyphshift-adapter-directwrite = { path = "../../implementations/native/directwrite" }
glyphshift-adapter-gdi = { path = "../../implementations/native/gdi" }
glyphshift-adapter-gdiplus = { path = "../../implementations/native/gdiplus" }
glyphshift-windows-host = { path = "../../../../test-support/windows-host" }

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.58", features = ["Win32_System_LibraryLoader"] }

[lints.rust]
unsafe_code = "allow"
