[package]
name = "glyphshift-controller-windows"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "glyphshift-controller-windows"
path = "src/main.rs"

[dependencies]
glyphshift-capture = { path = "../../../core/capture" }
glyphshift-controller-sdk = { path = "../sdk" }
glyphshift-runtime-contract = { path = "../../contract" }
glyphshift-target-runtime-contract = { path = "../../targets/contract" }
sha2 = "0.10"
glyphshift-adapter-native-host = { path = "../../../adapters/platform/native-host" }
serde_json = "1.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
]

[dev-dependencies]
glyphshift-adapter-gdi = { path = "../../../adapters/implementations/native/gdi" }
glyphshift-adapter-registry = { path = "../../../adapters/platform/registry" }
glyphshift-domain = { path = "../../../core/domain" }
glyphshift-translation = { path = "../../../core/translation" }

[lints.rust]
unsafe_code = "allow"
