[package]
name = "glyphshift-desktop-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "glyphshift-runtime-bundle-verify"
path = "src/bin/verify_runtime_bundle.rs"

[dependencies]
glyphshift-acquisition = { path = "../acquisition" }
glyphshift-acquisition-worker-host = { path = "../worker/acquisition-host" }
glyphshift-adapter-native-host = { path = "../../adapters/platform/native-host" }
glyphshift-adapter-registry = { path = "../../adapters/platform/registry" }
glyphshift-controller-host = { path = "../controller/host" }
glyphshift-capture = { path = "../../core/capture" }
glyphshift-desktop-backend = { path = "../../product/desktop-backend" }
glyphshift-domain = { path = "../../core/domain" }
glyphshift-extension = { path = "../../core/extension" }
glyphshift-isolated-worker-host = { path = "../worker/host" }
glyphshift-protocol = { path = "../protocol" }
glyphshift-runtime-contract = { path = "../contract" }
glyphshift-session = { path = "../session" }
glyphshift-target-process-host = { path = "../targets/process-host" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
url = "2.5"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "allow"
