[package]
name = "glyphshift-ai-translation"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
regex = "1.12"
reqwest = { version = "0.13.4", default-features = false, features = ["native-tls", "system-proxy"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.23.0"
tokio = { version = "1.53", features = ["rt", "time"] }

[lints]
workspace = true
