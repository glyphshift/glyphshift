[package]
name = "glyphshift-desktop-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
glyphshift-adapter-native-host = { path = "../glyphshift-adapter-native-host" }
glyphshift-adapter-registry = { path = "../glyphshift-adapter-registry" }
glyphshift-controller-host = { path = "../glyphshift-controller-host" }
glyphshift-capture = { path = "../glyphshift-capture" }
glyphshift-desktop-backend = { path = "../glyphshift-desktop-backend" }
glyphshift-domain = { path = "../glyphshift-domain" }
glyphshift-extension = { path = "../glyphshift-extension" }
glyphshift-isolated-worker-host = { path = "../glyphshift-isolated-worker-host" }
glyphshift-protocol = { path = "../glyphshift-protocol" }
glyphshift-runtime-contract = { path = "../glyphshift-runtime-contract" }
glyphshift-session = { path = "../glyphshift-session" }
glyphshift-target-process-host = { path = "../glyphshift-target-process-host" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
url = "2.5"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "allow"
