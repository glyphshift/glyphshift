[package]
name = "glyphshift-adapter-native-host"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
glyphshift-adapter-native-abi = { path = "../glyphshift-adapter-native-abi" }
glyphshift-adapter-sdk = { path = "../glyphshift-adapter-sdk" }
glyphshift-domain = { path = "../glyphshift-domain" }
libloading = "0.8"

[dev-dependencies]
glyphshift-adapter-console = { path = "../glyphshift-adapter-console" }
glyphshift-adapter-direct2d = { path = "../glyphshift-adapter-direct2d" }
glyphshift-adapter-directwrite = { path = "../glyphshift-adapter-directwrite" }
glyphshift-adapter-gdi = { path = "../glyphshift-adapter-gdi" }
glyphshift-adapter-gdiplus = { path = "../glyphshift-adapter-gdiplus" }
glyphshift-adapter-gtk3-pango = { path = "../glyphshift-adapter-gtk3-pango" }
glyphshift-adapter-qt-painter = { path = "../glyphshift-adapter-qt-painter" }
glyphshift-adapter-raylib = { path = "../glyphshift-adapter-raylib" }
glyphshift-windows-host = { path = "../../test-support/windows-host" }

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.58", features = ["Win32_System_LibraryLoader"] }

[lints.rust]
unsafe_code = "allow"
