[package]
name = "glyphshift-adapter-draw-text-native"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
glyphshift-adapter-gdi = { path = "../glyphshift-adapter-gdi" }
glyphshift-adapter-gdi-native-support = { path = "../glyphshift-adapter-gdi-native-support" }
glyphshift-adapter-native-abi = { path = "../glyphshift-adapter-native-abi" }
retour = "0.3"

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
]

[lints.rust]
unsafe_code = "allow"
