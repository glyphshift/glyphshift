[package]
name = "glyphshift-adapter-uia-worker"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
glyphshift-adapter-uia = { path = "../glyphshift-adapter-uia" }
glyphshift-capture = { path = "../glyphshift-capture" }
glyphshift-isolated-worker-sdk = { path = "../glyphshift-isolated-worker-sdk" }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.58"

[dependencies.windows]
version = "0.58"
features = [
    "implement",
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Accessibility",
]

[dev-dependencies]
glyphshift-domain = { path = "../glyphshift-domain" }
glyphshift-isolated-worker-host = { path = "../glyphshift-isolated-worker-host" }
tempfile = "3"

[lints.rust]
unsafe_code = "allow"
