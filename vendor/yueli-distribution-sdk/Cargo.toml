[package]
name = "yueli-distribution-sdk"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Native updater client for Yueli Distribution"
publish = false

[dependencies]
reqwest = { version = "0.13.4", default-features = false, features = ["json", "native-tls", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"

[dev-dependencies]
serde_json = "1"
